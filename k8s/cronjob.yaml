apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-world
  namespace: default
  labels:
    app: hello-world
spec:
  # Ogni 5 minuti
  schedule: "*/5 * * * *"
  # Conserva gli ultimi 5 job completati e 3 falliti per verifica log
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  # Se un job è ancora in esecuzione al prossimo ciclo, lo skippa
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Numero massimo di tentativi in caso di fallimento del Pod
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: hello-world
        spec:
          restartPolicy: Never
          containers:
            - name: hello-world
              # Immagine buildata localmente nel registry di minikube
              image: hello-world-job:latest
              # Non pullare da registry remoto, usa solo quella locale
              imagePullPolicy: Never
